services:
  app:
    build: .
    container_name: laravel_app
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - .:/var/www
    networks:
      - laravel

  scheduler:
    build: .
    container_name: laravel_scheduler
    command: php artisan schedule:work
    restart: unless-stopped
    volumes:
      - .:/var/www
    depends_on:
      - db
    networks:
      - laravel

  web:
    image: nginx:alpine
    container_name: laravel_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel

  db:
    image: postgres:18
    container_name: laravel_pgsql
    environment:
      POSTGRES_DB: erp_lmg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Lmg140818
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - laravel

networks:
  laravel:

volumes:
  postgres_data:
