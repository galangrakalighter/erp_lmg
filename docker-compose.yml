services:
  app:
    build: .
    container_name: laravel_app
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - .:/var/www
    networks:
      - laravel

  scheduler:
    build: .
    container_name: laravel_scheduler
    command: php artisan schedule:work
    restart: unless-stopped
    volumes:
      - .:/var/www
    depends_on:
      - db
    networks:
      - laravel

  web:
    image: nginx:alpine
    container_name: laravel_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
      - mcp
    networks:
      - laravel

  mcp:
    image: node:22-alpine
    container_name: erp_lmg_marketing_mcp
    command: node /app/plugins/erp-lmg-marketing/remote-poc/server.mjs
    restart: unless-stopped
    working_dir: /app
    environment:
      ERP_LMG_API_URL: http://web
      MCP_PUBLIC_URL: https://erp.lightermediagroup.com
      MCP_OAUTH_ISSUER: https://erp.lightermediagroup.com
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8787
    volumes:
      - .:/app:ro
    networks:
      - laravel

  db:
    image: postgres:18
    container_name: laravel_pgsql
    environment:
      POSTGRES_DB: ${DB_DATABASE:-erp_lmg}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi pada file .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - laravel

networks:
  laravel:

volumes:
  postgres_data:
